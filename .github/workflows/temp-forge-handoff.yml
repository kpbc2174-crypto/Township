name: Temporary Forge Handoff

on:
  push:
    paths:
      - '.github/workflows/temp-forge-handoff.yml'
      - '.github/temp-forge-handoff-request'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download Forge ZIP
        run: |
          curl --fail --location --silent --show-error \
            'https://tmpfiles.org/dl/wDwOPu0dAvCi/legacy-forge-phase1.zip' \
            -o Legacy-Forge-Phase1.zip
          test -s Legacy-Forge-Phase1.zip
      - name: Commit Forge ZIP
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f Legacy-Forge-Phase1.zip
          git commit -m 'Temporary Forge ZIP handoff'
          git push
