name: Temporary Forge Handoff

on:
  push:
    paths:
      - '.github/workflows/temp-forge-handoff.yml'
      - '.github/temp-forge-handoff-request'

permissions:
  contents: read

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify Forge ZIP
        run: |
          test -s Legacy-Forge-Phase1.zip
          python - <<'PY'
          import zipfile
          p='Legacy-Forge-Phase1.zip'
          assert zipfile.is_zipfile(p), 'handoff is not a ZIP'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert any(n.endswith('-Signed.apk') for n in names), names
              print(names)
          PY
      - name: Upload Forge ZIP handoff
        uses: actions/upload-artifact@v4
        with:
          name: legacy-forge-phase1-handoff
          path: Legacy-Forge-Phase1.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
